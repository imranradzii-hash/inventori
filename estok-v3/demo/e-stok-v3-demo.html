/**
 * Satu-satunya fungsi yang dipanggil oleh frontend melalui google.script.run.
 * Input & output dalam bentuk JSON string (elak masalah Date tidak boleh dihantar).
 */
function api(requestJson) {
  let req;
  try {
    SETTINGS_MEMO_ = null;
    req = JSON.parse(requestJson || '{}');
    const user = currentUser_(); // lempar ralat jika emel tidak berdaftar / tidak aktif
    const p = req.payload || {};
    let data;
    switch (req.action) {
      case 'bootstrap':        data = bootstrap_(user); break;
      case 'transaksi':        data = getTransactions_(user); break;
      case 'tambah':           data = withLock_(() => saveTransaction_(user, p)); break;
      case 'pindahan':         data = withLock_(() => saveTransfer_(user, p)); break;
      case 'kemaskini':        data = withLock_(() => updateTransaction_(user, p)); break;
      case 'batal':            data = withLock_(() => voidTransaction_(user, p)); break;
      case 'pengguna_senarai': data = listUsers_(user); break;
      case 'pengguna_simpan':  data = withLock_(() => saveUser_(user, p)); break;
      case 'audit':            data = getAuditLog_(user, p); break;
      case 'upload_pdf':       data = uploadToDrive_(user, p); break;
      default: throw new AppError_('TINDAKAN_TIDAK_SAH', 'Tindakan tidak dibenarkan.');
    }
    return JSON.stringify({ ok: true, data: data });
  } catch (err) {
    const kod = err && err.kod ? err.kod : 'RALAT';
    if (kod === 'RALAT') console.error(err && err.stack ? err.stack : err);
    return JSON.stringify({ ok: false, kod: kod, mesej: String(err && err.message ? err.message : err) });
  }
}

function bootstrap_(user) {

    pengguna: publicUser_(user),

    tetapan: getSettings_(),
    versi: APP.VERSI,
    hariIni: Utilities.formatDate(new Date(), APP.TZ, 'yyyy-MM-dd')
  };
}

/** Ralat yang mesejnya selamat dipaparkan kepada pengguna. */
function AppError_(kod, mesej) {
  this.kod = kod;
  this.message = mesej;
  this.stack = (new Error(mesej)).stack;
}
AppError_.prototype = Object.create(Error.prototype);

function withLock_(fn) {
  const lock = LockService.getScriptLock();
  if (!lock.tryLock(20000)) throw new AppError_('SIBUK', 'Sistem sedang memproses rekod lain. Sila cuba semula.');
  try { return fn(); } finally { lock.releaseLock(); }
}

// ---------------------------------------------------------------------------
// Akses asas
// ---------------------------------------------------------------------------
function getSs_() {
  const id = PropertiesService.getScriptProperties().getProperty('SPREADSHEET_ID');
  return id ? SpreadsheetApp.openById(id) : SpreadsheetApp.getActiveSpreadsheet();
}

function sheet_(nama) {
  const sh = getSs_().getSheetByName(nama);
  if (!sh) throw new AppError_('BELUM_SETUP', 'Helaian ' + nama + ' tiada. Pentadbir perlu jalankan setupV3().');
  return sh;
}

function ensureSheet_(ss, nama, headers) {
  let sh = ss.getSheetByName(nama);
  let baru = false;
  if (!sh) {
    sh = ss.insertSheet(nama);
    sh.getRange(1, 1, 1, headers.length).setValues([headers]);
    sh.setFrozenRows(1);
    baru = true;
  }
  return { sh: sh, baru: baru };
}

/** Peta lajur TRANSAKSI: kunci → nombor lajur (1-based). */
function txCols_(sh) {
  const lastCol = Math.max(sh.getLastColumn(), TX_LAMA.length);
  const tajuk = sh.getRange(1, 1, 1, lastCol).getValues()[0].map(h => String(h).trim());
  const peta = { _lebar: lastCol };
  TX_LAMA.forEach((c, i) => { peta[c[0]] = i + 1; });
  TX_BARU.forEach(c => {
    const idx = tajuk.indexOf(c[1]);
    if (idx >= 0) peta[c[0]] = idx + 1;
  });
  return peta;
}

function readRows_(sh, lebar) {
  const last = sh.getLastRow();
  if (last < 2) return [];
  return sh.getRange(2, 1, last - 1, lebar).getValues();
}

/** Semakan Date yang selamat merentas konteks (lebih tahan lasak daripada instanceof). */
function isDate_(v) { return Object.prototype.toString.call(v) === '[object Date]' && !isNaN(v.getTime()); }

function toIsoDate_(v) {
  if (isDate_(v)) return Utilities.formatDate(v, APP.TZ, 'yyyy-MM-dd');
  const s = String(v == null ? '' : v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1] + '-' + pad2_(m[2]) + '-' + pad2_(m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); // DD/MM/YYYY
  if (m) return m[3] + '-' + pad2_(m[2]) + '-' + pad2_(m[1]);
  return s;
}
function toDateTimeStr_(v) {
  if (isDate_(v)) return Utilities.formatDate(v, APP.TZ, 'yyyy-MM-dd HH:mm:ss');
  return String(v == null ? '' : v);
}
function isoToDate_(iso) {
  const p = iso.split('-').map(Number);
  return new Date(p[0], p[1] - 1, p[2]);
}
function nowStr_() { return Utilities.formatDate(new Date(), APP.TZ, 'yyyy-MM-dd HH:mm:ss'); }
function pad2_(x) { return ('0' + x).slice(-2); }
function clean_(v, max) { const s = String(v == null ? '' : v).trim(); return max ? s.slice(0, max) : s; }
/** Elak formula injection: nilai bermula = + - @ disimpan sebagai teks. */
function safe_(v) { const s = String(v == null ? '' : v); return /^[=+\-@]/.test(s) ? "'" + s : s; }
function newId_(prefix) {
  return prefix + '-' + Utilities.formatDate(new Date(), APP.TZ, 'yyMMdd') + '-' +
    Utilities.getUuid().replace(/-/g, '').slice(0, 6).toUpperCase();
}

  const aktif = rows.filter(r => r[0] && String(r[4]).toUpperCase() !== 'TIDAK')

    lokasi: aktif.filter(r => r[0] === 'LOKASI').map(r => ({ nama: String(r[1]), kod: String(r[2]) })),
    konfig: konfig
  };
  return SETTINGS_MEMO_;
}
function setKonfig_(kunci, nilai) {

  const i = rows.findIndex(r => r[0] === 'KONFIG' && String(r[1]) === kunci);

function setupV3() {
  const ss = SpreadsheetApp.getActiveSpreadsheet() || getSs_();
  const props = PropertiesService.getScriptProperties();
  props.setProperty('SPREADSHEET_ID', ss.getId());
  const laporan = [];

  const tx = ss.getSheetByName(SH.TRANSAKSI);
  if (!tx) throw new Error('Helaian TRANSAKSI tidak dijumpai. Pastikan skrip dibuka dari Google Sheets e-Stok.');

  // 1. Sandaran
  const namaBackup = 'BACKUP_TRANSAKSI_' + Utilities.formatDate(new Date(), APP.TZ, 'yyyyMMdd_HHmm');
  if (!ss.getSheetByName(namaBackup)) tx.copyTo(ss).setName(namaBackup);
  laporan.push('Sandaran dibuat: ' + namaBackup);

  // 2. Tajuk lajur
  const lastCol = Math.max(tx.getLastColumn(), TX_LAMA.length);
  const tajuk = tx.getRange(1, 1, 1, lastCol).getValues()[0].map(h => String(h).trim());
  TX_LAMA.forEach((c, i) => { if (!tajuk[i]) { tx.getRange(1, i + 1).setValue(c[1]); tajuk[i] = c[1]; } });
  const ditambah = [];
  TX_BARU.forEach(c => {
    if (tajuk.indexOf(c[1]) < 0) {
      tajuk.push(c[1]);
      tx.getRange(1, tajuk.length).setValue(c[1]);
      ditambah.push(c[1]);
    }
  });
  laporan.push(ditambah.length ? 'Lajur baharu ditambah: ' + ditambah.join(', ') : 'Lajur V3 sudah wujud.');

  // 3. ID & status untuk rekod lama
  const cols = txCols_(tx);
  const rows = readRows_(tx, cols._lebar);
  let idBaru = 0, statusBaru = 0;
  const lajurId = rows.map(r => [r[cols.id - 1]]);
  const lajurStatus = rows.map(r => [r[cols.status - 1]]);
  const itemDijumpai = {};
  rows.forEach((r, i) => {
    if (!r[0]) return; // baris kosong
    if (!String(r[cols.id - 1]).trim()) { lajurId[i][0] = 'LGC-' + Utilities.getUuid().replace(/-/g, '').slice(0, 10).toUpperCase(); idBaru++; }
    if (!String(r[cols.status - 1]).trim()) { lajurStatus[i][0] = 'AKTIF'; statusBaru++; }
    const it = ALIAS_ITEM[String(r[cols.item - 1])] || String(r[cols.item - 1]);
    if (it) itemDijumpai[it] = true;
  });
  if (rows.length) {
    tx.getRange(2, cols.id, rows.length, 1).setValues(lajurId);
    tx.getRange(2, cols.status, rows.length, 1).setValues(lajurStatus);
  }
  laporan.push('Rekod sedia ada: ' + rows.filter(r => r[0]).length + ' · ID dijana: ' + idBaru + ' · Status AKTIF diisi: ' + statusBaru);

  // 4. Helaian sokongan
  [[SH.PENGGUNA, HEADERS.PENGGUNA], [SH.AUDIT, HEADERS.AUDIT], [SH.ARKIB, HEADERS.ARKIB]].forEach(x => {
    const r = ensureSheet_(ss, x[0], x[1]);
    laporan.push(x[0] + (r.baru ? ' dicipta.' : ' sudah wujud.'));
  });
  const t = ensureSheet_(ss, SH.TETAPAN, HEADERS.TETAPAN);
  if (t.baru) {
    const seed = [];
    LOKASI_ASAL.forEach((l, i) => seed.push(['LOKASI', l[0], l[1], i + 1, 'YA', '']));
    const namaItem = ITEM_ASAL.map(x => x[0]);
    ITEM_ASAL.forEach((it, i) => seed.push(['ITEM', it[0], it[1], i + 1, 'YA', 'Nilai 2 = paras stok minimum']));
    Object.keys(itemDijumpai).filter(n => namaItem.indexOf(n) < 0).forEach((n, i) => {
      seed.push(['ITEM', n, 0, 100 + i, 'YA', 'Ditemui dalam data lama semasa migrasi']);
    });
    seed.push(['KONFIG', 'FOLDER_ARKIB_ID', APP.FOLDER_ARKIB_ASAL, 1, 'YA', 'Folder Google Drive arkib laporan PDF']);
    seed.push(['KONFIG', 'NO_FAIL', '', 2, 'YA', 'No. fail rasmi pada laporan']);
    seed.push(['KONFIG', 'DOMAIN_EMEL', '', 3, 'YA', 'Hanya emel domain ini dibenarkan (diisi automatik oleh setupFirstAdmin)']);
    seed.push(['KONFIG', 'VERSI_SKEMA', APP.VERSI_SKEMA, 4, 'YA', 'Jangan ubah']);
    t.sh.getRange(2, 1, seed.length, HEADERS.TETAPAN.length).setValues(seed);
    laporan.push('TETAPAN dicipta dengan ' + LOKASI_ASAL.length + ' lokasi dan ' + seed.filter(s => s[0] === 'ITEM').length + ' item.');
  } else {
    laporan.push('TETAPAN sudah wujud (tidak diubah).');
  }

  // 5. Lindungi helaian sensitif (hanya pemilik boleh edit terus)
  [SH.PENGGUNA, SH.AUDIT, SH.TETAPAN].forEach(n => protectOwnerOnly_(ss.getSheetByName(n), laporan));

  // 6. Zon masa
  const tzSheet = ss.getSpreadsheetTimeZone();
  const tzSkrip = Session.getScriptTimeZone();
  if (tzSheet !== APP.TZ || tzSkrip !== APP.TZ) {
    laporan.push('AMARAN zon masa: Sheet=' + tzSheet + ', Skrip=' + tzSkrip + '. Tetapkan kedua-duanya kepada ' + APP.TZ + ' (File > Settings dan appsscript.json).');
  } else {
    laporan.push('Zon masa OK (' + APP.TZ + ').');
  }

  SETTINGS_MEMO_ = null;
  writeAuditLog_(systemUser_(), 'SETUP_V3', 'SISTEM', '', null, { laporan: laporan }, '');
  return showReport_('Setup V3 selesai', laporan);
}

function protectOwnerOnly_(sh, laporan) {
  try {
    const p = sh.protect().setDescription('e-Stok V3: hanya pemilik skrip. Ubah melalui sistem.');
    p.addEditor(Session.getEffectiveUser());
    p.removeEditors(p.getEditors().filter(e => e.getEmail() !== Session.getEffectiveUser().getEmail()));
    if (p.canDomainEdit()) p.setDomainEdit(false);
  } catch (e) {
    laporan.push('Tidak dapat lindungi ' + sh.getName() + ': ' + e.message);
  }
}

/** Semakan integriti — boleh dijalankan bila-bila masa dari menu. */
function semakIntegriti() {
  const sh = sheet_(SH.TRANSAKSI);
  const cols = txCols_(sh);
  const s = getSettings_();
  const namaItem = s.items.map(i => i.nama), namaLokasi = s.lokasi.map(l => l.nama);
  const rows = readRows_(sh, cols._lebar);
  const isu = [];
  const ids = {};
  const baki = {};
  rows.forEach((r, i) => {
    if (!r[0]) return;
    const baris = i + 2;
    const t = rowToTx_(r, cols);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(t.tarikh)) isu.push('Baris ' + baris + ': tarikh tidak sah (' + t.tarikh + ')');
    if (!t.id) isu.push('Baris ' + baris + ': tiada ID');
    else if (ids[t.id]) isu.push('Baris ' + baris + ': ID berganda dengan baris ' + ids[t.id]);
    else ids[t.id] = baris;
    if (namaItem.indexOf(t.item) < 0) isu.push('Baris ' + baris + ': item tidak dikenali "' + t.item + '"');
    if (namaLokasi.indexOf(t.lokasi) < 0) isu.push('Baris ' + baris + ': lokasi tidak dikenali "' + t.lokasi + '"');
    if (!(t.kuantiti > 0)) isu.push('Baris ' + baris + ': kuantiti tidak sah (' + r[cols.kuantiti - 1] + ')');
    if (t.status === 'AKTIF') {
      const k = t.lokasi + ' | ' + t.item;
      baki[k] = (baki[k] || 0) + (t.arah === 'Masuk' ? t.kuantiti : -t.kuantiti);
    }
  });
  Object.keys(baki).forEach(k => { if (baki[k] < 0) isu.push('Baki negatif: ' + k + ' = ' + baki[k]); });
  const ringkas = ['Rekod disemak: ' + rows.filter(r => r[0]).length, 'Isu dijumpai: ' + isu.length].concat(isu.slice(0, 50));
  if (isu.length > 50) ringkas.push('… dan ' + (isu.length - 50) + ' isu lagi (lihat Logger).');
  isu.forEach(x => console.log(x));
  return showReport_('Semakan integriti', ringkas);
}

function showReport_(tajuk, baris) {
  const teks = baris.join('\n');
  console.log(tajuk + '\n' + teks);
  try { SpreadsheetApp.getUi().alert(tajuk, teks, SpreadsheetApp.getUi().ButtonSet.OK); } catch (e) { /* dijalankan dari editor */ }
  return { tajuk: tajuk, baris: baris };
}

/**
 * Auth.gs — identiti pengguna (emel Google kerajaan), peranan, kebenaran dan pengurusan akaun.
 *
 * Tiada kata laluan disimpan. Google mengesahkan siapa pengguna; sistem ini menentukan
 * apa yang pengguna itu boleh buat berdasarkan helaian PENGGUNA.
 */

const PERANAN = {
  ADMIN_UPK:    { label: 'Admin UPK',     lihatSemua: true,  tulis: 'SEMUA',   urusPengguna: true,  audit: true,  lokasiHQ: true },
  KERANI_UPK:   { label: 'Kerani UPK',    lihatSemua: true,  tulis: 'SENDIRI', urusPengguna: false, audit: false, lokasiHQ: true },
  PEMANTAU_UPK: { label: 'Pemantau UPK',  lihatSemua: true,  tulis: 'TIADA',   urusPengguna: false, audit: false, lokasiHQ: true },
  KERANI_PAD:   { label: 'Kerani PAD',    lihatSemua: false, tulis: 'SENDIRI', urusPengguna: false, audit: false, lokasiHQ: false },
  PEGAWAI_PAD:  { label: 'Pegawai PAD',   lihatSemua: false, tulis: 'TIADA',   urusPengguna: false, audit: false, lokasiHQ: false }
};
const KOL_PENGGUNA = { emel: 1, nama: 2, jawatan: 3, peranan: 4, lokasi: 5, status: 6, aksesTerakhir: 7, diciptaOleh: 8, diciptaPada: 9, dikemaskiniOleh: 10, dikemaskiniPada: 11 };

// ---------------------------------------------------------------------------
// Identiti
// ---------------------------------------------------------------------------
function currentUser_() {
  const emel = String(Session.getActiveUser().getEmail() || '').trim().toLowerCase();
  if (!emel) {
    throw new AppError_('TIADA_EMEL', 'Sistem tidak dapat mengenal pasti akaun Google anda. Pastikan anda log masuk dengan emel jabatan, kemudian muat semula halaman.');
  }
  const domain = String(getSettings_().konfig.DOMAIN_EMEL || '').trim().toLowerCase();
  if (domain && emel.split('@')[1] !== domain) {
    throw new AppError_('DOMAIN_DITOLAK', 'Akaun ' + emel + ' bukan emel jabatan (@' + domain + '). Sila log masuk dengan emel kerajaan.');
  }
  const u = findUser_(emel);
  if (!u) throw new AppError_('TIADA_AKSES', 'Emel ' + emel + ' belum didaftarkan dalam e-Stok. Sila hubungi Admin UPK untuk akses.');
  if (u.status !== 'AKTIF') throw new AppError_('TIDAK_AKTIF', 'Akaun ' + emel + ' telah dinyahaktifkan. Sila hubungi Admin UPK.');
  if (!PERANAN[u.peranan]) throw new AppError_('PERANAN_TIDAK_SAH', 'Peranan akaun anda tidak sah. Sila hubungi Admin UPK.');
  return u;
}

function readUsers_() {
  const sh = sheet_(SH.PENGGUNA);
  return readRows_(sh, HEADERS.PENGGUNA.length).map((r, i) => ({
    baris: i + 2,
    emel: String(r[0]).trim().toLowerCase(),
    nama: String(r[1]),
    jawatan: String(r[2]),
    peranan: String(r[3]).trim().toUpperCase(),
    lokasi: String(r[4]),
    status: String(r[5]).trim().toUpperCase() || 'AKTIF',
    aksesTerakhir: toDateTimeStr_(r[6]),
    diciptaOleh: String(r[7]),
    diciptaPada: toDateTimeStr_(r[8]),
    dikemaskiniOleh: String(r[9]),
    dikemaskiniPada: toDateTimeStr_(r[10])
  })).filter(u => u.emel);
}
function findUser_(emel) { return readUsers_().find(u => u.emel === emel) || null; }

function publicUser_(u) {
  return { emel: u.emel, nama: u.nama, jawatan: u.jawatan, peranan: u.peranan, labelPeranan: PERANAN[u.peranan].label, lokasi: u.lokasi };
}
function systemUser_() {
  let emel = '';
  try { emel = Session.getEffectiveUser().getEmail(); } catch (e) {}
  return { emel: emel, nama: 'SISTEM (pentadbir skrip)', peranan: 'SISTEM', lokasi: '' };
}

// ---------------------------------------------------------------------------
// Kebenaran — SATU-SATUNYA tempat peraturan akses ditentukan
// ---------------------------------------------------------------------------
function canView_(u, lokasi) { return PERANAN[u.peranan].lihatSemua || u.lokasi === lokasi; }
function canWrite_(u, lokasi) {
  const t = PERANAN[u.peranan].tulis;
  return t === 'SEMUA' || (t === 'SENDIRI' && u.lokasi === lokasi);
}
function requireWrite_(u, lokasi) {
  if (!canWrite_(u, lokasi)) throw new AppError_('DILARANG', 'Anda tiada kebenaran merekod atau mengubah stok bagi ' + lokasi + '.');
}
function requireAdmin_(u) {
  if (!PERANAN[u.peranan].urusPengguna) throw new AppError_('DILARANG', 'Fungsi ini terhad kepada Admin UPK.');
}
function permissionsFor_(u) {
  const r = PERANAN[u.peranan];
  const semua = getSettings_().lokasi.map(l => l.nama);
  return {
    lihatSemua: r.lihatSemua,
    lokasiDilihat: r.lihatSemua ? semua : [u.lokasi],
    lokasiDitulis: r.tulis === 'SEMUA' ? semua : (r.tulis === 'SENDIRI' ? [u.lokasi] : []),
    urusPengguna: r.urusPengguna,
    audit: r.audit,
    paksaBaki: u.peranan === 'ADMIN_UPK'
  };
}

// ---------------------------------------------------------------------------
// Pengurusan akaun (Admin UPK)
// ---------------------------------------------------------------------------
function listUsers_(admin) {
  requireAdmin_(admin);
  return {
    pengguna: readUsers_().map(u => { const x = Object.assign({}, u); delete x.baris; return x; }),
    peranan: Object.keys(PERANAN).map(k => ({ kod: k, label: PERANAN[k].label, lokasiHQ: PERANAN[k].lokasiHQ }))
  };
}

function saveUser_(admin, p) {
  requireAdmin_(admin);
  const emel = clean_(p.emel).toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emel)) throw new AppError_('INPUT', 'Format emel tidak sah.');
  const domain = String(getSettings_().konfig.DOMAIN_EMEL || '').toLowerCase();
  if (domain && emel.split('@')[1] !== domain) throw new AppError_('INPUT', 'Hanya emel @' + domain + ' boleh didaftarkan.');
  const nama = clean_(p.nama, 120);
  if (nama.length < 3) throw new AppError_('INPUT', 'Nama penuh diperlukan.');
  const peranan = clean_(p.peranan).toUpperCase();
  if (!PERANAN[peranan]) throw new AppError_('INPUT', 'Peranan tidak sah.');
  const hq = lokasiHQ_();
  let lokasi = clean_(p.lokasi);
  if (PERANAN[peranan].lokasiHQ) lokasi = hq;
  if (getSettings_().lokasi.map(l => l.nama).indexOf(lokasi) < 0) throw new AppError_('INPUT', 'Lokasi tidak sah.');
  if (!PERANAN[peranan].lokasiHQ && lokasi === hq) throw new AppError_('INPUT', 'Peranan PAD mesti ditetapkan kepada lokasi daerah, bukan HQ.');
  const status = clean_(p.status || 'AKTIF').toUpperCase();
  if (['AKTIF', 'TIDAK_AKTIF'].indexOf(status) < 0) throw new AppError_('INPUT', 'Status tidak sah.');

  const semua = readUsers_();
  const sedia = semua.find(u => u.emel === emel);
  if (p.baru && sedia) throw new AppError_('INPUT', 'Emel ini sudah didaftarkan.');
  if (!p.baru && !sedia) throw new AppError_('INPUT', 'Akaun tidak dijumpai.');

  // Elak sistem tanpa pentadbir: admin tidak boleh turunkan / nyahaktif diri sendiri,
  // dan mesti kekal sekurang-kurangnya seorang Admin UPK aktif.
  if (sedia && sedia.emel === admin.emel && (peranan !== 'ADMIN_UPK' || status !== 'AKTIF')) {
    throw new AppError_('DILARANG', 'Anda tidak boleh menukar peranan atau menyahaktifkan akaun sendiri.');
  }
  if (sedia && sedia.peranan === 'ADMIN_UPK' && (peranan !== 'ADMIN_UPK' || status !== 'AKTIF')) {
    const adminAktif = semua.filter(u => u.peranan === 'ADMIN_UPK' && u.status === 'AKTIF').length;
    if (adminAktif <= 1) throw new AppError_('DILARANG', 'Sistem mesti mempunyai sekurang-kurangnya seorang Admin UPK aktif.');
  }

  const sh = sheet_(SH.PENGGUNA);
  const kini = nowStr_();
  const baris = [safe_(emel), safe_(nama), safe_(clean_(p.jawatan, 120)), peranan, safe_(lokasi), status,
    sedia ? sedia.aksesTerakhir : '', sedia ? sedia.diciptaOleh : admin.emel, sedia ? sedia.diciptaPada : kini, admin.emel, kini];
  if (sedia) sh.getRange(sedia.baris, 1, 1, baris.length).setValues([baris]);
  else sh.appendRow(baris);

  const ringkas = u => u ? { emel: u.emel, nama: u.nama, jawatan: u.jawatan, peranan: u.peranan, lokasi: u.lokasi, status: u.status } : null;
  writeAuditLog_(admin, sedia ? 'KEMASKINI_PENGGUNA' : 'TAMBAH_PENGGUNA', 'PENGGUNA', emel, ringkas(sedia),
    { emel: emel, nama: nama, jawatan: clean_(p.jawatan, 120), peranan: peranan, lokasi: lokasi, status: status }, '');
  return listUsers_(admin);
}

function logAccessOncePerDay_(u) {
  const kunci = 'akses_' + u.emel + '_' + Utilities.formatDate(new Date(), APP.TZ, 'yyyyMMdd');
  const cache = CacheService.getScriptCache();
  if (cache.get(kunci)) return;
  cache.put(kunci, '1', 21600);
  sheet_(SH.PENGGUNA).getRange(u.baris, KOL_PENGGUNA.aksesTerakhir).setValue(nowStr_());
  writeAuditLog_(u, 'AKSES_SISTEM', 'PENGGUNA', u.emel, null, null, '');
}

// ---------------------------------------------------------------------------
// FASA 1 — Admin pertama (dijalankan sekali oleh pemilik skrip dari menu Sheet)
// ---------------------------------------------------------------------------
function setupFirstAdmin() {
  const emel = String(Session.getEffectiveUser().getEmail() || '').toLowerCase();
  if (!emel) throw new Error('Tidak dapat membaca emel anda. Jalankan dari akaun Google jabatan.');
  const users = readUsers_();
  if (users.some(u => u.peranan === 'ADMIN_UPK' && u.status === 'AKTIF')) {
    return showReport_('Admin sudah wujud', ['Admin UPK aktif sudah wujud. Tambah admin lain melalui menu Pengguna dalam sistem.']);
  }
  let nama = 'Pentadbir Sistem';
  try {
    const ui = SpreadsheetApp.getUi();
    const r = ui.prompt('Admin pertama', 'Nama penuh anda (untuk ' + emel + '):', ui.ButtonSet.OK_CANCEL);
    if (r.getSelectedButton() !== ui.Button.OK) return null;
    nama = clean_(r.getResponseText(), 120) || nama;
  } catch (e) { /* dari editor: guna nama lalai, boleh dikemaskini dalam sistem */ }

  const kini = nowStr_();
  sheet_(SH.PENGGUNA).appendRow([emel, safe_(nama), 'Pentadbir Sistem e-Stok', 'ADMIN_UPK', lokasiHQ_(), 'AKTIF', '', emel, kini, emel, kini]);
  if (!getSettings_().konfig.DOMAIN_EMEL) setKonfig_('DOMAIN_EMEL', emel.split('@')[1]);
  writeAuditLog_(systemUser_(), 'TAMBAH_PENGGUNA', 'PENGGUNA', emel, null, { emel: emel, nama: nama, peranan: 'ADMIN_UPK' }, 'Admin pertama');
  return showReport_('Admin pertama didaftarkan', [
    emel + ' kini Admin UPK.',
    'Domain emel dikunci kepada: @' + emel.split('@')[1],
    'Langkah seterusnya: Deploy > New deployment > Web app (Execute as: Me, Who has access: Anyone within domain).'
  ]);
}

;
/**
 * Inventory.gs — transaksi stok: baca, tambah, pindahan, kemaskini dan pembatalan.
 *
 * Peraturan ketepatan:
 *  - Rekod tidak dipadam. Pembatalan menukar Status kepada BATAL dengan sebab, dan rekod BATAL
 *    tidak dikira dalam baki.
 *  - Setiap perubahan (tambah, edit, batal) disimulasi dahulu; jika ia menyebabkan baki mana-mana
 *    lokasi/item menjadi negatif, ia ditolak (Admin UPK boleh paksa dengan pengesahan).
 *  - Pindahan antara lokasi = dua baris berpasangan yang ditulis dalam satu operasi.
 */

const JENIS_MASUK = ['Terima Pembekal', 'Pindahan Masuk', 'Pelarasan (+)'];
const JENIS_SAH = ['Terima Pembekal', 'Pindahan Masuk', 'Pindahan Keluar', 'Pengeluaran Kursus', 'Pelarasan (+)', 'Pelarasan (-)', 'Cabutan Sijil'];

// ---------------------------------------------------------------------------
// Baca
// ---------------------------------------------------------------------------
function rowToTx_(r, c) {
  const g = k => (c[k] ? r[c[k] - 1] : '');
  const jenis = String(g('jenis')).trim();
  const arahAsal = String(g('arah')).trim();
  const item = String(g('item')).trim();
  return {
    id: String(g('id')).trim(),
    tarikh: toIsoDate_(g('tarikh')),
    lokasi: String(g('lokasi')).trim(),
    item: ALIAS_ITEM[item] || item,
    jenis: jenis,
    arah: arahAsal === 'Masuk' || arahAsal === 'Keluar' ? arahAsal : (JENIS_MASUK.indexOf(jenis) >= 0 ? 'Masuk' : 'Keluar'),
    kuantiti: Number(g('kuantiti')) || 0,
    siriKursus: String(g('siriKursus')),
    jumlahPeserta: g('jumlahPeserta') === '' ? '' : Number(g('jumlahPeserta')),
    rujukan: String(g('rujukan')),
    direkodOleh: String(g('direkodOleh')),
    catatan: String(g('catatan')),
    status: String(g('status')).trim().toUpperCase() || 'AKTIF',
    diciptaPada: toDateTimeStr_(g('diciptaPada')),
    emelPerekod: String(g('emelPerekod')),
    dikemaskiniOleh: String(g('dikemaskiniOleh')),
    dikemaskiniPada: toDateTimeStr_(g('dikemaskiniPada')),
    dibatalOleh: String(g('dibatalOleh')),
    dibatalPada: toDateTimeStr_(g('dibatalPada')),
    sebabBatal: String(g('sebabBatal')),
    pasangan: String(g('pasangan')).trim()
  };
}

function readTransactions_() {
  const sh = sheet_(SH.TRANSAKSI);
  const c = txCols_(sh);
  if (!c.status) throw new AppError_('BELUM_SETUP', 'Struktur TRANSAKSI belum dinaik taraf. Pentadbir perlu jalankan setupV3().');
  const rows = readRows_(sh, c._lebar);
  const senarai = [];
  rows.forEach((r, i) => { if (r[0]) senarai.push({ baris: i + 2, raw: r, t: rowToTx_(r, c) }); });
  return { sh: sh, c: c, senarai: senarai };
}

function getTransactions_(u) {
  const d = readTransactions_();
  return {
    transaksi: d.senarai.map(x => x.t).filter(t => canView_(u, t.lokasi)),
    dibacaPada: nowStr_()
  };
}

// ---------------------------------------------------------------------------
// Tulis
// ---------------------------------------------------------------------------
function validateTx_(p) {
  const s = getSettings_();
  const tarikh = clean_(p.tarikh);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(tarikh) || toIsoDate_(isoToDate_(tarikh)) !== tarikh) throw new AppError_('INPUT', 'Tarikh tidak sah.');
  if (tarikh > Utilities.formatDate(new Date(), APP.TZ, 'yyyy-MM-dd')) throw new AppError_('INPUT', 'Tarikh tidak boleh melebihi hari ini.');
  const lokasi = clean_(p.lokasi);
  if (s.lokasi.map(l => l.nama).indexOf(lokasi) < 0) throw new AppError_('INPUT', 'Lokasi tidak sah.');
  const item = clean_(p.item);
  if (s.items.map(i => i.nama).indexOf(item) < 0) throw new AppError_('INPUT', 'Item tidak sah.');
  const jenis = clean_(p.jenis);
  if (JENIS_SAH.indexOf(jenis) < 0) throw new AppError_('INPUT', 'Jenis transaksi tidak sah.');
  const kuantiti = Number(p.kuantiti);
  if (!Number.isInteger(kuantiti) || kuantiti <= 0 || kuantiti > 1000000) throw new AppError_('INPUT', 'Kuantiti mesti nombor bulat antara 1 dan 1,000,000.');
  const kursus = jenis === 'Pengeluaran Kursus';
  let peserta = '';
  if (kursus && p.jumlahPeserta !== '' && p.jumlahPeserta != null) {
    peserta = Number(p.jumlahPeserta);
    if (!Number.isInteger(peserta) || peserta < 0) throw new AppError_('INPUT', 'Jumlah peserta tidak sah.');
  }
  return {
    tarikh: tarikh, lokasi: lokasi, item: item, jenis: jenis,
    arah: JENIS_MASUK.indexOf(jenis) >= 0 ? 'Masuk' : 'Keluar',
    kuantiti: kuantiti,
    siriKursus: kursus ? clean_(p.siriKursus, 60) : '',
    jumlahPeserta: peserta,
    rujukan: clean_(p.rujukan, 80),
    catatan: clean_(p.catatan, 500)
  };
}

/**
 * Simulasi baki: tolak jika perubahan menyebabkan baki (lokasi, item) menjadi negatif
 * atau lebih negatif daripada sebelumnya.
 */
function checkStock_(u, aktif, buangIds, tambah, paksa) {
  const kunci = t => t.lokasi + '||' + t.item;
  const terlibat = {};
  aktif.filter(t => buangIds.indexOf(t.id) >= 0).concat(tambah).forEach(t => { terlibat[kunci(t)] = true; });
  const nilai = t => (t.arah === 'Masuk' ? t.kuantiti : -t.kuantiti);
  const masalah = [];
  Object.keys(terlibat).forEach(k => {
    const sebelum = aktif.filter(t => kunci(t) === k).reduce((s, t) => s + nilai(t), 0);
    const selepas = aktif.filter(t => kunci(t) === k && buangIds.indexOf(t.id) < 0).concat(tambah.filter(t => kunci(t) === k))
      .reduce((s, t) => s + nilai(t), 0);
    if (selepas < 0 && selepas < sebelum) {
      const bahagian = k.split('||');
      masalah.push(bahagian[1] + ' di ' + bahagian[0] + ': baki ' + sebelum + ' → ' + selepas);
    }
  });
  if (!masalah.length) return [];
  if (paksa && permissionsFor_(u).paksaBaki) return masalah;
  throw new AppError_('BAKI_TIDAK_CUKUP', 'Baki tidak mencukupi. ' + masalah.join('; ') + '.');
}

function txToRow_(t, c, asal) {
  const row = asal ? asal.slice() : new Array(c._lebar).fill('');
  const set = (k, v) => { if (c[k]) row[c[k] - 1] = v; };
  set('tarikh', isoToDate_(t.tarikh));
  ['lokasi', 'item', 'jenis', 'siriKursus', 'rujukan', 'direkodOleh', 'catatan', 'emelPerekod', 'dikemaskiniOleh', 'dibatalOleh', 'sebabBatal']
    .forEach(k => set(k, safe_(t[k])));
  set('arah', t.arah);
  set('kuantiti', Number(t.kuantiti));
  set('jumlahPeserta', t.jumlahPeserta === '' || t.jumlahPeserta == null ? '' : Number(t.jumlahPeserta));
  set('id', t.id);
  set('status', t.status);
  set('diciptaPada', t.diciptaPada || '');
  set('dikemaskiniPada', t.dikemaskiniPada || '');
  set('dibatalPada', t.dibatalPada || '');
  set('pasangan', t.pasangan || '');
  return row;
}

function appendTx_(d, list) {
  const rows = list.map(t => txToRow_(t, d.c, null));
  d.sh.getRange(d.sh.getLastRow() + 1, 1, rows.length, d.c._lebar).setValues(rows); // satu operasi tulis
}

function auditView_(t) {
  if (!t) return null;
  return { id: t.id, tarikh: t.tarikh, lokasi: t.lokasi, item: t.item, jenis: t.jenis, kuantiti: t.kuantiti, rujukan: t.rujukan, status: t.status };
}

function saveTransaction_(u, p) {
  if (p.jenis === 'Pindahan Keluar' && p.lokasiPenerima) return saveTransfer_(u, p);
  const t = validateTx_(p);
  requireWrite_(u, t.lokasi);
  const d = readTransactions_();
  const kini = nowStr_();
  Object.assign(t, { id: newId_('TRX'), status: 'AKTIF', direkodOleh: u.nama, emelPerekod: u.emel, diciptaPada: kini, pasangan: '' });
  const aktif = d.senarai.map(x => x.t).filter(x => x.status === 'AKTIF');
  const dipaksa = checkStock_(u, aktif, [], [t], p.paksa);
  appendTx_(d, [t]);
  writeAuditLog_(u, 'TAMBAH_TRANSAKSI', 'TRANSAKSI', t.id, null, auditView_(t), dipaksa.length ? 'DIPAKSA: ' + dipaksa.join('; ') : '');
  return Object.assign(getTransactions_(u), { mesej: 'Transaksi ' + t.id + ' disimpan.' });
}

function saveTransfer_(u, p) {
  const keluar = validateTx_(Object.assign({}, p, { jenis: 'Pindahan Keluar' }));
  requireWrite_(u, keluar.lokasi);
  const penerima = clean_(p.lokasiPenerima);
  if (getSettings_().lokasi.map(l => l.nama).indexOf(penerima) < 0 || penerima === keluar.lokasi) {
    throw new AppError_('INPUT', 'Lokasi penerima tidak sah.');
  }
  const d = readTransactions_();
  const kini = nowStr_();
  const asas = { status: 'AKTIF', direkodOleh: u.nama, emelPerekod: u.emel, diciptaPada: kini, siriKursus: '', jumlahPeserta: '' };
  Object.assign(keluar, asas, { id: newId_('TRX') });
  const masuk = Object.assign({}, keluar, { id: newId_('TRX'), lokasi: penerima, jenis: 'Pindahan Masuk', arah: 'Masuk' });
  keluar.pasangan = masuk.id;
  masuk.pasangan = keluar.id;
  const aktif = d.senarai.map(x => x.t).filter(x => x.status === 'AKTIF');
  const dipaksa = checkStock_(u, aktif, [], [keluar, masuk], p.paksa);
  appendTx_(d, [keluar, masuk]);
  writeAuditLog_(u, 'PINDAHAN_STOK', 'TRANSAKSI', keluar.id + ' > ' + masuk.id, null,
    { keluar: auditView_(keluar), masuk: auditView_(masuk) }, dipaksa.length ? 'DIPAKSA: ' + dipaksa.join('; ') : '');
  return Object.assign(getTransactions_(u), { mesej: 'Pindahan ' + keluar.item + ' (' + keluar.kuantiti + ') ke ' + penerima + ' direkod.' });
}

function findTx_(d, id) {
  const x = d.senarai.find(s => s.t.id === clean_(id));
  if (!x) throw new AppError_('TIADA', 'Rekod tidak dijumpai.');
  return x;
}
/** Untuk rekod berpasangan, kebenaran ditentukan oleh lokasi penghantar (baris Keluar). */
function pairOf_(d, x) {
  if (!x.t.pasangan) return { utama: x, pasangan: null, lokasiKawalan: x.t.lokasi };
  const p = d.senarai.find(s => s.t.id === x.t.pasangan) || null;
  const keluar = x.t.arah === 'Keluar' ? x : (p || x);
  return { utama: x, pasangan: p, lokasiKawalan: keluar.t.lokasi };
}

function updateTransaction_(u, p) {
  const d = readTransactions_();
  const x = findTx_(d, p.id);
  if (x.t.status !== 'AKTIF') throw new AppError_('DILARANG', 'Rekod yang dibatalkan tidak boleh dikemaskini.');
  const pr = pairOf_(d, x);
  requireWrite_(u, pr.lokasiKawalan);

  const input = Object.assign({}, p);
  if (pr.pasangan || x.t.pasangan) { input.jenis = x.t.jenis; input.lokasi = x.t.lokasi; } // pindahan: jenis & lokasi tetap
  else if (u.peranan !== 'ADMIN_UPK') input.lokasi = x.t.lokasi;                        // hanya Admin boleh pindah lokasi rekod
  if (input.jenis === 'Pindahan Keluar' && !x.t.pasangan && x.t.jenis !== 'Pindahan Keluar') {
    throw new AppError_('INPUT', 'Untuk pindahan antara lokasi, batalkan rekod ini dan rekod pindahan baharu.');
  }
  const v = validateTx_(input);
  if (v.lokasi !== x.t.lokasi) requireWrite_(u, v.lokasi);

  const kini = nowStr_();
  const baru = Object.assign({}, x.t, v, { dikemaskiniOleh: u.nama, dikemaskiniPada: kini });
  const kemaskini = [{ x: x, t: baru }];
  if (pr.pasangan) {
    const pb = Object.assign({}, pr.pasangan.t, {
      tarikh: v.tarikh, item: v.item, kuantiti: v.kuantiti, rujukan: v.rujukan, catatan: v.catatan,
      dikemaskiniOleh: u.nama, dikemaskiniPada: kini
    });
    kemaskini.push({ x: pr.pasangan, t: pb });
  }
  const aktif = d.senarai.map(s => s.t).filter(t => t.status === 'AKTIF');
  const dipaksa = checkStock_(u, aktif, kemaskini.map(k => k.x.t.id), kemaskini.map(k => k.t), p.paksa);
  kemaskini.forEach(k => d.sh.getRange(k.x.baris, 1, 1, d.c._lebar).setValues([txToRow_(k.t, d.c, k.x.raw)]));
  writeAuditLog_(u, 'KEMASKINI_TRANSAKSI', 'TRANSAKSI', kemaskini.map(k => k.t.id).join(' > '),
    auditView_(x.t), auditView_(baru), [clean_(p.sebab, 300), dipaksa.length ? 'DIPAKSA: ' + dipaksa.join('; ') : ''].filter(Boolean).join(' | '));
  return Object.assign(getTransactions_(u), { mesej: 'Rekod ' + baru.id + ' dikemaskini.' });
}

function voidTransaction_(u, p) {
  const sebab = clean_(p.sebab, 300);
  if (sebab.length < 5) throw new AppError_('INPUT', 'Sila nyatakan sebab pembatalan (sekurang-kurangnya 5 aksara).');
  const d = readTransactions_();
  const x = findTx_(d, p.id);
  if (x.t.status !== 'AKTIF') throw new AppError_('DILARANG', 'Rekod ini sudah dibatalkan.');
  const pr = pairOf_(d, x);
  requireWrite_(u, pr.lokasiKawalan);
  const sasaran = [x].concat(pr.pasangan && pr.pasangan.t.status === 'AKTIF' ? [pr.pasangan] : []);
  const aktif = d.senarai.map(s => s.t).filter(t => t.status === 'AKTIF');
  const dipaksa = checkStock_(u, aktif, sasaran.map(s => s.t.id), [], p.paksa);
  const kini = nowStr_();
  sasaran.forEach(s => {
    const t = Object.assign({}, s.t, { status: 'BATAL', dibatalOleh: u.nama, dibatalPada: kini, sebabBatal: sebab });
    d.sh.getRange(s.baris, 1, 1, d.c._lebar).setValues([txToRow_(t, d.c, s.raw)]);
  });
  writeAuditLog_(u, 'BATAL_TRANSAKSI', 'TRANSAKSI', sasaran.map(s => s.t.id).join(' > '), auditView_(x.t), { status: 'BATAL' },
    sebab + (dipaksa.length ? ' | DIPAKSA: ' + dipaksa.join('; ') : ''));
  return Object.assign(getTransactions_(u), { mesej: sasaran.length > 1 ? 'Kedua-dua rekod pindahan dibatalkan.' : 'Rekod dibatalkan.' });
}

/**
 * Audit.gs — jejak audit. Hanya boleh DITAMBAH melalui writeAuditLog_().
 * Tiada fungsi API untuk mengubah atau memadam log. Helaian AUDIT_LOG dilindungi (pemilik sahaja).
 */

function writeAuditLog_(u, tindakan, jenisRekod, idRekod, sebelum, selepas, sebab) {
  const sh = sheet_(SH.AUDIT);
  const json = o => (o == null ? '' : safe_(JSON.stringify(o)).slice(0, 45000));
  sh.appendRow([
    nowStr_(), safe_(u.emel || ''), safe_(u.nama || ''), u.peranan || '', safe_(u.lokasi || ''),
    tindakan, jenisRekod || '', safe_(idRekod || ''), json(sebelum), json(selepas), safe_(sebab || '')
  ]);
}

function getAuditLog_(u, p) {
  if (!PERANAN[u.peranan].audit) throw new AppError_('DILARANG', 'Jejak audit terhad kepada Admin UPK.');
  const sh = sheet_(SH.AUDIT);
  const last = sh.getLastRow();
  if (last < 2) return { log: [] };
  const had = Math.min(Number(p && p.had) || 500, 2000);
  const mula = Math.max(2, last - had + 1);
  const rows = sh.getRange(mula, 1, last - mula + 1, HEADERS.AUDIT.length).getValues();
  const log = rows.reverse().map(r => ({
    masa: toDateTimeStr_(r[0]), emel: String(r[1]), nama: String(r[2]), peranan: String(r[3]), lokasi: String(r[4]),
    tindakan: String(r[5]), jenisRekod: String(r[6]), idRekod: String(r[7]), sebelum: String(r[8]), selepas: String(r[9]), sebab: String(r[10])
  }));
  return { log: log };
}

/**
 * Drive.gs — arkib laporan PDF ke Google Drive dan rekod dalam ARKIB_LAPORAN.
 */

function uploadToDrive_(u, p) {
  const lokasi = clean_(p.lokasi);
  if (lokasi === 'SEMUA') {
    if (!PERANAN[u.peranan].lihatSemua) throw new AppError_('DILARANG', 'Anda tiada akses kepada laporan keseluruhan.');
  } else if (!canView_(u, lokasi)) {
    throw new AppError_('DILARANG', 'Anda tiada akses kepada laporan ' + lokasi + '.');
  }
  const bulan = clean_(p.bulan);
  if (!/^\d{4}-\d{2}$/.test(bulan)) throw new AppError_('INPUT', 'Bulan laporan tidak sah.');
  const data = String(p.data || '');
  if (data.length > 14 * 1024 * 1024) throw new AppError_('INPUT', 'Fail terlalu besar (maksimum 10MB).');
  const bytes = Utilities.base64Decode(data);
  // Semak tandatangan fail PDF ("%PDF")
  if (bytes.length < 4 || bytes[0] !== 0x25 || bytes[1] !== 0x50 || bytes[2] !== 0x44 || bytes[3] !== 0x46) {
    throw new AppError_('INPUT', 'Fail bukan PDF yang sah.');
  }
  const namaLokasi = lokasi === 'SEMUA' ? 'KESELURUHAN' : lokasi;
  const namaFail = (namaLokasi + ' - Laporan Stok ' + bulan + ' - ' + Utilities.formatDate(new Date(), APP.TZ, 'yyyyMMdd-HHmm') + '.pdf')
    .replace(/[\\/:*?"<>|]/g, '-');
  const folderId = getSettings_().konfig.FOLDER_ARKIB_ID || APP.FOLDER_ARKIB_ASAL;
  const fail = DriveApp.getFolderById(folderId).createFile(Utilities.newBlob(bytes, 'application/pdf', namaFail));
  fail.setDescription('Dijana oleh ' + u.nama + ' (' + u.emel + ') melalui ' + APP.NAMA);
  sheet_(SH.ARKIB).appendRow([nowStr_(), safe_(namaLokasi), bulan, safe_(namaFail), fail.getUrl(), fail.getId(), safe_(u.emel)]);
  writeAuditLog_(u, 'ARKIB_LAPORAN', 'LAPORAN', fail.getId(), null, { namaFail: namaFail, lokasi: namaLokasi, bulan: bulan }, '');
  return { url: fail.getUrl(), namaFail: namaFail };
}

  // ---------- Simpan / muat keadaan ----------
  function simpan() {
    simpanLS(KUNCI, JSON.stringify({ props, sheets: ss.sheets.map(s => ({ name: s.name, data: s.data.map(r => r.map(v => v instanceof Date ? { __d: v.getTime() } : v)) })) }));
  }
  function muat() {
    const raw = bacaLS(KUNCI); if (!raw) return false;
    try {
      const o = JSON.parse(raw); props = o.props || {};
      ss.sheets = o.sheets.map(x => { const s = new Sheet(x.name); s.data = x.data.map(r => r.map(v => v && typeof v === 'object' && '__d' in v ? new Date(v.__d) : v)); return s; });
      return true;
    } catch (e) { return false; }
  }

  // ---------- Data contoh ----------
  function seed() {
    ss.sheets = []; props = {};
    const tx = ss.insertSheet('TRANSAKSI');
    const kini = new Date();
    const t = (bulanLalu, hari) => { const d = new Date(kini.getFullYear(), kini.getMonth() - bulanLalu, hari); return d > kini ? new Date(kini.getFullYear(), kini.getMonth(), Math.max(1, kini.getDate() - 1)) : d; };
    // Rekod "V2" lama (12 lajur, sebahagian tanpa ID)
    tx.data = [['Tarikh', 'Lokasi', 'Item', 'Jenis', 'Arah', 'Kuantiti', 'Siri Kursus', 'Jumlah Peserta', 'Rujukan', 'ID', 'Direkod Oleh', 'Catatan'],
      [t(3, 4), 'UPK BUUKI (HQ)', 'Sijil', 'Terima Pembekal', 'Masuk', 2500, '', '', 'DO-2026-101', '', 'Rekod V2', ''],
      [t(3, 4), 'UPK BUUKI (HQ)', 'Buku Gerbang Perkahwinan', 'Terima Pembekal', 'Masuk', 2500, '', '', 'DO-2026-101', '', 'Rekod V2', ''],
      [t(3, 4), 'UPK BUUKI (HQ)', 'Beg', 'Terima Pembekal', 'Masuk', 2500, '', '', 'DO-2026-102', '', 'Rekod V2', ''],
      [t(3, 4), 'UPK BUUKI (HQ)', 'Pen', 'Terima Pembekal', 'Masuk', 3000, '', '', 'DO-2026-102', '', 'Rekod V2', ''],
      [t(3, 4), 'UPK BUUKI (HQ)', 'Buku Nota', 'Terima Pembekal', 'Masuk', 2500, '', '', 'DO-2026-103', '', 'Rekod V2', ''],
      [t(3, 6), 'UPK BUUKI (HQ)', 'Mineral', 'Terima Pembekal', 'Masuk', 60, '', '', 'DO-2026-104', '', 'Rekod V2', ''],
      [t(3, 6), 'UPK BUUKI (HQ)', 'Gula-gula (Balang)', 'Terima Pembekal', 'Masuk', 30, '', '', 'DO-2026-104', '', 'Rekod V2', '']];
    GAS.setupV3();
    GAS.setupFirstAdmin();
    const A = PENGGUNA_DEMO[0].emel, KU = PENGGUNA_DEMO[1].emel;
    const panggil = (emel, action, payload) => { env.emel = emel; const r = JSON.parse(GAS.api(JSON.stringify({ action, payload }))); if (!r.ok) console_.warn('seed:', action, r.mesej); return r.data; };
    const iso = d => fmtDate(d, '', 'yyyy-MM-dd');
    panggil(A, 'pengguna_simpan', Object.assign({}, PENGGUNA_DEMO[0], { status: 'AKTIF' }));
    PENGGUNA_DEMO.slice(1).forEach(u => panggil(A, 'pengguna_simpan', Object.assign({ baru: true }, u)));
    const PAD = ['Daerah Seberang Perai Tengah', 'Daerah Seberang Perai Selatan', 'Daerah Barat Daya', 'Daerah SPU (Butterworth)', 'Daerah SPU (Kepala Batas)', 'Daerah Timur Laut'];
    PAD.forEach((l, k) => ['Sijil', 'Buku Gerbang Perkahwinan', 'Beg', 'Pen', 'Buku Nota'].forEach(it =>
      panggil(KU, 'pindahan', { tarikh: iso(t(2, 2 + k)), lokasi: 'UPK BUUKI (HQ)', lokasiPenerima: l, item: it, kuantiti: 260 + k * 10, rujukan: 'PDH/' + (k + 1) + '/2026' })));
    PAD.forEach((l, k) => ['Sijil', 'Buku Gerbang Perkahwinan', 'Beg', 'Pen'].forEach(it =>
      panggil(A, 'tambah', { tarikh: iso(t(1, 8 + k)), lokasi: l, item: it, jenis: 'Pengeluaran Kursus', kuantiti: 90 + k * 8, siriKursus: 'Siri ' + (10 + k) + '/2026', jumlahPeserta: 90 + k * 8 })));
    PAD.forEach((l, k) => ['Sijil', 'Buku Gerbang Perkahwinan', 'Beg'].forEach(it =>
      panggil(A, 'tambah', { tarikh: iso(t(0, 2 + k)), lokasi: l, item: it, jenis: 'Pengeluaran Kursus', kuantiti: 70 + k * 9, siriKursus: 'Siri ' + (20 + k) + '/2026', jumlahPeserta: 70 + k * 9 })));
    panggil(KU, 'tambah', { tarikh: iso(t(0, 3)), lokasi: 'UPK BUUKI (HQ)', item: 'Mineral (Karton)', jenis: 'Pengeluaran Kursus', kuantiti: 54, siriKursus: 'Siri 19/2026', jumlahPeserta: 160 });
    panggil(KU, 'tambah', { tarikh: iso(t(0, 3)), lokasi: 'UPK BUUKI (HQ)', item: 'Kertas A4 (Kotak)', jenis: 'Terima Pembekal', kuantiti: 2, rujukan: 'PO-2026-077' });
    const d = panggil(PENGGUNA_DEMO[3].emel, 'tambah', { tarikh: iso(t(0, 1)), lokasi: 'Daerah Barat Daya', item: 'Beg', jenis: 'Pelarasan (-)', kuantiti: 6, catatan: 'Beg koyak semasa penghantaran' });
    const salah = d && d.transaksi.find(x => x.catatan === 'Beg koyak semasa penghantaran');
    if (salah) panggil(PENGGUNA_DEMO[3].emel, 'batal', { id: salah.id, sebab: 'Rekod berganda, telah direkod oleh rakan sekerja' });
    simpan();
  }

  if (!muat()) seed();
  env.emel = bacaSS('estok_demo_emel') || PENGGUNA_DEMO[0].emel;

  // ---------- google.script.run tiruan ----------
  function runner(ok, fail) {
    return new Proxy({}, { get: (_, k) => {
      if (k === 'withSuccessHandler') return f => runner(f, fail);
      if (k === 'withFailureHandler') return f => runner(ok, f);
      return (arg) => setTimeout(() => {
        try { const r = GAS[k](arg); simpan(); ok && ok(r); } catch (e) { fail && fail(e); }
      }, 250); // anggaran kelewatan rangkaian
    } });
  }
  window.google = { script: { run: runner(null, null) } };

  // ---------- Panel demo ----------
  window.__estokDemo = { PENGGUNA_DEMO, TIDAK_BERDAFTAR,
    tukar: (emel) => { simpanSS('estok_demo_emel', emel); location.reload(); },
    reset: () => { try { localStorage.removeItem(KUNCI); } catch (e) {} location.reload(); },
    semasa: () => env.emel };
})();
